name: Atto return-first formatter conformance on external runner
on:
  push:
    branches: [test/atto-return-first-20261118]
permissions:
  contents: read
jobs:
  node-formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify ten Atto formatter source blobs
        shell: bash
        run: |
          set -euo pipefail
          cd atto-format
          count=0
          while IFS=$'\t' read -r expected path; do
            test "$(git hash-object -- "$path")" = "$expected"
            ((count+=1))
          done < BLOB_SHA_MANIFEST.tsv
          test "$count" -eq 10
          echo "Validated exact ten formatter blob SHAs from 197cbcadc3a8745baa42adce9cd7b524cbd53f32"
      - name: Run checked-in Node formatter regressions
        run: |
          node --test atto-format/tests/*.test.mjs
      - name: Build pinned Atto compiler for actual guest parity
        run: cd atto-src && cargo build --locked --bin attoc
      - name: Verify formatter does not change executable guest
        run: node test-runner/atto-format-guest-proof.mjs
