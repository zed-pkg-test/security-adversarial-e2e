name: DEN-2725 external help delimiter fix

on:
  push:
    branches:
      - main
      - agent/den-2725-help-delimiter-fix
  pull_request:
    paths:
      - .github/workflows/den-2725-help-delimiter-fix.yml
      - scripts/apply-den-2725-help-delimiter-fix.py
      - docs/den-2725-help-delimiter-fix.md

permissions:
  contents: read

concurrency:
  group: den-2725-help-delimiter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ZED_CLI_COMMIT: 1c94813c6b59c7621c1256d7c55246e7f06f44b7

jobs:
  verify-and-export:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out security harness without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          fetch-depth: 1

      - name: Check out exact product candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_COMMIT }}
          path: product/zed-cli
          persist-credentials: false
          show-progress: false
          fetch-depth: 1

      - name: Verify immutable product identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ZED_CLI_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C product/zed-cli rev-parse HEAD)" = "$ZED_CLI_COMMIT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Apply narrow reviewed patch in disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/apply-den-2725-help-delimiter-fix.py
          rm -rf scripts/__pycache__
          python scripts/apply-den-2725-help-delimiter-fix.py --root product/zed-cli
          changed="$(git -C product/zed-cli diff --name-only)"
          expected=$'src/external_subcommands.rs\ntests/external_gitops_dispatch.rs'
          test "$changed" = "$expected"
          git -C product/zed-cli diff --check

      - name: Run focused semantic gates
        working-directory: product/zed-cli
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo test --locked --lib external_subcommands::tests
          cargo test --locked --test external_gitops_dispatch
          cargo clippy --locked --lib --bin zed --bin zed-gitops --test external_gitops_dispatch -- -D warnings

      - name: Export exact verified product files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/src artifact/tests
          cp product/zed-cli/src/external_subcommands.rs artifact/src/
          cp product/zed-cli/tests/external_gitops_dispatch.rs artifact/tests/
          git -C product/zed-cli diff --binary > artifact/den-2725-help-delimiter-fix.patch
          shasum -a 256 \
            artifact/src/external_subcommands.rs \
            artifact/tests/external_gitops_dispatch.rs \
            artifact/den-2725-help-delimiter-fix.patch \
            > artifact/SHA256SUMS

      - name: Require clean harness checkout
        shell: bash
        run: |
          set -euo pipefail
          harness_status="$(git status --porcelain --untracked-files=all | grep -vE '^\?\? (artifact|product)/' || true)"
          test -z "$harness_status"

      - name: Upload corrected source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: den-2725-help-delimiter-${{ env.ZED_CLI_COMMIT }}
          path: artifact
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
