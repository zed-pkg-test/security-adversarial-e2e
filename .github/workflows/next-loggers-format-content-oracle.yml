name: next-loggers format content oracle

on:
  pull_request:
    paths:
      - '.github/workflows/next-loggers-format-content-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-content:
    name: format ${{ matrix.file }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: go
            file: sdk/go/context_adversarial_test.go
          - kind: go
            file: sdk/go/logger.go
          - kind: go
            file: sdk/go/logger_test.go
          - kind: go
            file: sdk/go/span_test.go
          - kind: dart
            file: sdk/dart/lib/next_loggers.dart
          - kind: dart
            file: sdk/dart/lib/shutdown_io.dart
          - kind: dart
            file: sdk/dart/test/adversarial.dart
          - kind: dart
            file: sdk/dart/test/adversarial_test.dart
          - kind: dart
            file: sdk/dart/test/next_loggers_test.dart
    env:
      NEXT_LOGGERS_SHA: c8b57a9cf158016ff47442c652641541907152b8
      FORMAT_KIND: ${{ matrix.kind }}
      FORMAT_FILE: ${{ matrix.file }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Fetch exact next-loggers source
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin https://github.com/ORESoftware/next-loggers.ts.git
          git -C source fetch --no-tags --depth=1 origin "$NEXT_LOGGERS_SHA"
          test "$(git -C source rev-parse FETCH_HEAD)" = "$NEXT_LOGGERS_SHA"
          git -C source checkout --detach "$NEXT_LOGGERS_SHA"
      - name: Format one file and expose canonical bytes
        shell: bash
        run: |
          set -euo pipefail
          target="source/$FORMAT_FILE"
          case "$FORMAT_KIND" in
            go) gofmt -w "$target" ;;
            dart) dart format "$target" >/dev/null ;;
            *) echo "unknown formatter: $FORMAT_KIND" >&2; exit 2 ;;
          esac
          echo "BEGIN_FORMATTED_FILE:$FORMAT_FILE"
          base64 -w0 "$target"
          echo
          echo "END_FORMATTED_FILE:$FORMAT_FILE"
