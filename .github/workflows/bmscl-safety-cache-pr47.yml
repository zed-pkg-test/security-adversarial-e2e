name: bmscl safety cache PR47 proof

on:
  pull_request:
    paths:
      - "adversarial/bmscl-safety-cache-pr47/**"
      - ".github/workflows/bmscl-safety-cache-pr47.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - name: Verify exact private-upstream source blob pin
        shell: bash
        run: |
          set -euo pipefail
          fixture="adversarial/bmscl-safety-cache-pr47/src/lib.rs"
          pin="adversarial/bmscl-safety-cache-pr47/source-pin.json"
          test "$(git hash-object "$fixture")" = "de917d9da16b74dabb70663d7696ce81175de0c2"
          jq -e '.repository == "beamscale/bmscl-compiler"' "$pin" >/dev/null
          jq -e '.pull_request == 47' "$pin" >/dev/null
          jq -e '.head_sha == "35f349ccd8067d8e6f01dd399d923827b73db1a4"' "$pin" >/dev/null
          jq -e '.path == "src/safety_cache.rs"' "$pin" >/dev/null
          jq -e '.git_blob_sha == "de917d9da16b74dabb70663d7696ce81175de0c2"' "$pin" >/dev/null
      - name: Rustfmt exact source
        run: cargo fmt --manifest-path adversarial/bmscl-safety-cache-pr47/Cargo.toml --all -- --check
      - name: Clippy exact source
        run: cargo clippy --manifest-path adversarial/bmscl-safety-cache-pr47/Cargo.toml --all-targets -- -D warnings
      - name: Run adversarial unit tests
        run: cargo test --manifest-path adversarial/bmscl-safety-cache-pr47/Cargo.toml --all-targets
