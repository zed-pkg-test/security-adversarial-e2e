name: next-loggers format artifact

on:
  pull_request:
    paths:
      - '.github/workflows/next-loggers-format-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-formatted-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_LOGGERS_SHA: c8b57a9cf158016ff47442c652641541907152b8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Fetch exact next-loggers source
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin https://github.com/ORESoftware/next-loggers.ts.git
          git -C source fetch --no-tags --depth=1 origin "$NEXT_LOGGERS_SHA"
          test "$(git -C source rev-parse FETCH_HEAD)" = "$NEXT_LOGGERS_SHA"
          git -C source checkout --detach "$NEXT_LOGGERS_SHA"
      - name: Format exact source
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w source/sdk/go
          dart format source/sdk/dart >/dev/null
          mkdir -p formatted/sdk
          cp -R source/sdk/go formatted/sdk/go
          cp -R source/sdk/dart formatted/sdk/dart
      - uses: actions/upload-artifact@v4
        with:
          name: next-loggers-formatted-go-dart
          path: formatted
          if-no-files-found: error
          retention-days: 1
