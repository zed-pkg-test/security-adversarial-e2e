name: next-loggers Gleam format oracle

on:
  pull_request:
    paths:
      - '.github/workflows/next-loggers-gleam-format-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gleam-format-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_LOGGERS_SHA: 6194f249640aea9bbaad449632c2f844fdb515ae
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          gleam-version: '1.17.0'
      - name: Fetch exact next-loggers source
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin https://github.com/ORESoftware/next-loggers.ts.git
          git -C source fetch --no-tags --depth=1 origin "$NEXT_LOGGERS_SHA"
          test "$(git -C source rev-parse FETCH_HEAD)" = "$NEXT_LOGGERS_SHA"
          git -C source checkout --detach "$NEXT_LOGGERS_SHA"
      - name: Print canonical Gleam formatter diff
        shell: bash
        run: |
          set -euo pipefail
          cd source/sdk/gleam
          gleam format src test
          cd ../..
          git diff -- sdk/gleam/src/oresoftware_next_loggers/context.gleam sdk/gleam/src/oresoftware_next_loggers/shutdown.gleam
          if ! git diff --quiet -- sdk/gleam/src/oresoftware_next_loggers/context.gleam sdk/gleam/src/oresoftware_next_loggers/shutdown.gleam; then
            echo 'FORMAT_ORACLE_DIFF_PRESENT'
            exit 1
          fi
