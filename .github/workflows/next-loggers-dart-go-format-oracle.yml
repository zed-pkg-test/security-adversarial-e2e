name: next-loggers Dart Go format oracle

on:
  pull_request:
    paths:
      - '.github/workflows/next-loggers-dart-go-format-oracle.yml'
      - '.github/workflows/next-loggers-gleam-format-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dart-go-format-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_LOGGERS_SHA: c8b57a9cf158016ff47442c652641541907152b8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Fetch exact next-loggers source
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin https://github.com/ORESoftware/next-loggers.ts.git
          git -C source fetch --no-tags --depth=1 origin "$NEXT_LOGGERS_SHA"
          test "$(git -C source rev-parse FETCH_HEAD)" = "$NEXT_LOGGERS_SHA"
          git -C source checkout --detach "$NEXT_LOGGERS_SHA"
      - name: Print canonical Go formatter diff
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w source/sdk/go
          git -C source diff -- sdk/go
      - name: Print canonical Dart formatter diff
        shell: bash
        run: |
          set -euo pipefail
          dart format source/sdk/dart
          git -C source diff -- sdk/dart
      - name: Fail while formatter drift exists
        shell: bash
        run: |
          if ! git -C source diff --quiet -- sdk/go sdk/dart; then
            echo 'FORMAT_ORACLE_DIFF_PRESENT'
            exit 1
          fi
