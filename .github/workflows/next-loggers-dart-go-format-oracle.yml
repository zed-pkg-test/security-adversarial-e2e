name: next-loggers Dart Go format acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/next-loggers-dart-go-format-oracle.yml'
      - '.github/workflows/next-loggers-gleam-format-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dart-go-format-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_LOGGERS_SHA: 9cb63c6952b035af4ec30c163feaf900846ef1a7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Fetch exact next-loggers source
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin https://github.com/ORESoftware/next-loggers.ts.git
          git -C source fetch --no-tags --depth=1 origin "$NEXT_LOGGERS_SHA"
          test "$(git -C source rev-parse FETCH_HEAD)" = "$NEXT_LOGGERS_SHA"
          git -C source checkout --detach "$NEXT_LOGGERS_SHA"
      - name: Verify canonical Go formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l source/sdk/go)"
          if [[ -n "$unformatted" ]]; then
            printf 'Go files require gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Verify canonical Dart formatting
        shell: bash
        run: dart format --output=none --set-exit-if-changed source/sdk/dart
