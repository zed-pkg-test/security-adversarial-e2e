[package]
name = "ores-ast-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "3.0.5", features = ["full", "visit"] }
